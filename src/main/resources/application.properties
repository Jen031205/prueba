spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/prueba}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cloe_123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public

# Spring Cloud Config (deshabilitado para ejecucion local)
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Redis para cachear el catalogo de productos.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# Datos reales de demostración indicados en la documentación.
gestopago.auth.url=${GESTOPAGO_AUTH_URL:https://gestopago.portalventas.net}
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:83}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:GPS83-TPV-17}
gestopago.auth.password=${GESTOPAGO_PASSWORD:12345678}
gestopago.auth.refresh-rate-ms=${GESTOPAGO_REFRESH_RATE_MS:3600000}

# Datos de PuntoRed indicados en la documentación.
