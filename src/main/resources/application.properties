puntored.api.connect-timeout-ms=${PUNTORED_API_CONNECT_TIMEOUT_MS:5000}
puntored.api.read-timeout-ms=${PUNTORED_API_READ_TIMEOUT_MS:10000}

# ===================================================================
# OPTIMIZACIÓN DE RENDIMIENTO Y ALTA CONCURRENCIA (APACHE JMETER)
# ===================================================================
# Servidor Tomcat embebido
server.tomcat.threads.max=250
server.tomcat.threads.min-spare=25
server.tomcat.max-connections=10000
server.tomcat.accept-count=200
server.tomcat.connection-timeout=20000

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000