spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/prueba}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public

# Configuracion del servicio de autenticacion de GestoPago.
gestopago.auth.url=${GESTOPAGO_AUTH_URL:https://gestopago.portalventas.net}
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:}
gestopago.auth.password=${GESTOPAGO_PASSWORD:}
gestopago.auth.refresh-rate-ms=${GESTOPAGO_REFRESH_RATE_MS:3600000}

# Configuracion del servicio externo de PuntoRed.
puntored.api.base-url=${PUNTORED_API_BASE_URL:https://gestopago.portalventas.net}
puntored.api.token=${PUNTORED_API_TOKEN:}
puntored.api.api-key=${PUNTORED_API_KEY:}
puntored.api.connect-timeout-ms=${PUNTORED_API_CONNECT_TIMEOUT_MS:5000}
puntored.api.read-timeout-ms=${PUNTORED_API_READ_TIMEOUT_MS:10000}
